service: app_with_parallel_roles
image: app_with_parallel_roles
servers:
  web:
    hosts:
      - vm1
      - vm2
  workers:
    hosts:
      - vm1
    cmd: sleep infinity
deploy_timeout: 2
drain_timeout: 2
readiness_delay: 0
boot:
  parallel_roles: true
proxy:
  host: localhost
  ssl: false
  healthcheck:
    interval: 1
    timeout: 1
    path: "/up"
  response_timeout: 2
registry:
  server: registry:4443
  username: root
  password: root
# Kamal's file computes arch with Kamal::Utils.docker_arch and COMMIT_SHA with
# `git rev-parse HEAD` in ERB. Wunjo's ERB subset reads ENV, which the deployer's
# wunjo wrapper sets.
builder:
  driver: docker
  arch: <%= ENV["LOCAL_ARCH"] %>
  args:
    COMMIT_SHA: <%= ENV["COMMIT_SHA"] %>
