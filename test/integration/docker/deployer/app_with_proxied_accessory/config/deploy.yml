service: app_with_proxied_accessory
image: app_with_proxied_accessory
env:
  clear:
    CLEAR_TOKEN: 4321
    CLEAR_TAG: ""
    HOST_TOKEN: "${HOST_TOKEN}"
asset_path: /usr/share/nginx/html/versions
proxy:
  host: 127.0.0.1
registry:
  server: registry:4443
  username: root
  password: root
# Kamal's file computes arch with Kamal::Utils.docker_arch and COMMIT_SHA with
# `git rev-parse HEAD` in ERB. Wunjo's ERB subset reads ENV, which the deployer's
# wunjo wrapper sets.
builder:
  driver: docker
  arch: <%= ENV["LOCAL_ARCH"] %>
  args:
    COMMIT_SHA: <%= ENV["COMMIT_SHA"] %>
accessories:
  busybox:
    service: custom-busybox
    image: busybox:1.36.0
    cmd: sh -c 'echo "Starting busybox..."; trap exit term; while true; do sleep 1; done'
    host: vm1
  netcat:
    service: netcat
    image: busybox:1.36.0
    cmd: >
      sh -c 'echo "Starting netcat..."; while true; do echo -e "HTTP/1.1 200 OK\r\nContent-Length: 11\r\n\r\nHello Ruby" | nc -l -p 80; done'
    host: vm1
    port: "127.0.0.1:12345:80"
    proxy:
      host: netcat
      ssl: false
      healthcheck:
        interval: 1
        timeout: 1
        path: "/"
drain_timeout: 2
