service: app
image: app
servers:
  - vm1
  - vm2: [ tag1, tag2 ]
env:
  clear:
    CLEAR_TOKEN: 4321
    CLEAR_TAG: ""
    HOST_TOKEN: "${HOST_TOKEN}"
  secret:
    - SECRET_TOKEN
    - INTERPOLATED_SECRET1
    - INTERPOLATED_SECRET2
    - INTERPOLATED_SECRET3
    - INTERPOLATED_SECRET4
  tags:
    tag1:
      CLEAR_TAG: tagged
    tag2:
      secret:
        - SECRET_TAG
asset_path: /usr/share/nginx/html/versions:ro
hooks_output:
  pre-deploy: :verbose
  pre-build: :quiet
deploy_timeout: 2
drain_timeout: 2
readiness_delay: 0
output:
  file:
    path: /tmp/kamal-deploy-logs
  otel:
    endpoint: http://otel_collector:4318
proxy:
  host: 127.0.0.1
registry:
  server: localhost:5000
# Kamal's file computes arch with Kamal::Utils.docker_arch and COMMIT_SHA with
# `git rev-parse HEAD` in ERB. Wunjo's ERB subset reads ENV, which the deployer's
# wunjo wrapper sets.
builder:
  driver: docker
  arch: <%= ENV["LOCAL_ARCH"] %>
  args:
    COMMIT_SHA: <%= ENV["COMMIT_SHA"] %>
accessories:
  busybox:
    service: custom-busybox
    image: busybox:1.36.0
    cmd: sh -c 'echo "Starting busybox..."; trap exit term; while true; do sleep 1; done'
    roles:
      - web
    files:
      - local: config/busybox.conf
        remote: /etc/busybox.conf
        mode: "0640"
        owner: "1000:1000"
    directories:
      - local: data
        remote: /data
        mode: "0750"
        owner: "1000:1000"
        options: "ro"
  busybox2:
    service: custom-busybox
    image: busybox:1.36.0
    cmd: sh -c 'echo "Starting busybox..."; trap exit term; while true; do sleep 1; done'
    host: vm3
